name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag matching Hourstone.toc (for example v0.1.0)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hourstone-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python tests/run.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate tag and build package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python tools/package.py --tag "$RELEASE_TAG"
      - name: Publish release after successful checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if existing=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq .object.sha 2>/dev/null); then
              test "$existing" = "$GITHUB_SHA" || { echo 'Tag already points to another commit'; exit 1; }
            else
              gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
            fi
          fi
          version="${RELEASE_TAG#v}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; preserving published assets.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" "dist/Hourstone-$version.zip" "dist/Hourstone-$version.zip.sha256" \
            --verify-tag --title "Hourstone $version â€“ Azeroth Hours" --notes-file docs/RELEASE-NOTES.md
