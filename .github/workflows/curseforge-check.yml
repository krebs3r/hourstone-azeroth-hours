name: Check CurseForge connection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/privacy_guard.py
      - name: Check token and configured game versions without uploading
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python tools/curseforge.py --check
